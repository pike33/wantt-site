<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Wantt Admin</title>
  <meta name="theme-color" content="#11131b">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card" aria-labelledby="admin-title">
      <div class="brand">wantt</div>
      <p class="eyebrow">private admin</p>
      <h1 id="admin-title">Wantt Admin</h1>

      <div id="loading" class="state">
        <p>Checking your admin session…</p>
      </div>

      <div id="signed-out" class="state" hidden>
        <p class="lede">Sign in with the authorised Wantt Google Workspace account.</p>
        <div id="google-signin"></div>
        <p id="auth-error" class="error" role="alert" hidden></p>
      </div>

      <div id="signed-in" class="state" hidden>
        <div class="success-mark" aria-hidden="true">✓</div>
        <h2>Authenticated</h2>
        <p id="identity" class="lede"></p>
        <p class="muted">The admin shell is working. Production data views will be added separately.</p>
        <button id="signout" type="button">Sign out</button>
      </div>
    </section>
  </main>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
