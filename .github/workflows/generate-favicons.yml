name: Generate favicons

on:
  push:
    branches: [main]
    paths:
      - 'assets/wantt-app-icon.webp'
      - '.github/workflows/generate-favicons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install image renderer
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate PNG icons
        run: |
          convert assets/wantt-app-icon.webp -resize 96x96 assets/favicon-96.png
          convert assets/wantt-app-icon.webp -resize 180x180 assets/apple-touch-icon.png

      - name: Commit generated icons
        run: |
          if git diff --quiet -- assets/favicon-96.png assets/apple-touch-icon.png && git ls-files --error-unmatch assets/favicon-96.png assets/apple-touch-icon.png >/dev/null 2>&1; then
            echo "Favicons already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon-96.png assets/apple-touch-icon.png
          git commit -m "Generate raster favicons"
          git push
